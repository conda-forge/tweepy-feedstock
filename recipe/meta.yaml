{% set name = "tweepy" %}
{% set version = "4.16.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/tweepy-{{ version }}.tar.gz
  sha256: 1d95cbdc50bf6353a387f881f2584eaf60d14e00dbbdd8872a73de79c66878e3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - flit-core <4
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - oauthlib >=3.2.0,<4
    - requests >=2.27.0,<3
    - requests-oauthlib >=1.2.0,<3

test:
  imports:
    - tweepy
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://www.tweepy.org
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: An easy-to-use Python library for accessing the Twitter API

  doc_url: http://tweepy.readthedocs.io
  dev_url: https://github.com/tweepy/tweepy

extra:
  recipe-maintainers:
    - nikicc
    - ocefpaf
